<title>FLuM3n · 测试站点</title>
<style>body{margin:0;background:#f3f6fa;color:#17233a;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{max-width:600px;margin:24px;padding:40px;border-radius:24px;background:white;box-shadow:0 12px 48px #17233a12}small{color:#15805b;font-weight:600}h1{font-size:36px;letter-spacing:-1px}p{line-height:1.8;color:#526078}button{background:#2457e8;color:white;border:0;border-radius:12px;padding:14px 22px;font-size:16px;cursor:pointer}code{background:#edf2fb;padding:4px 8px;border-radius:6px}footer{margin-top:28px;font-size:13px;color:#748098}</style>
